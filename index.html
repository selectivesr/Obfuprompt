<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Obfuscator Tool</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        .field-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
        }

        textarea:focus, select:focus {
            outline: 2px solid var(--accent-color);
            border-color: transparent;
        }

        select {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        button {
            flex: 1;
            padding: 0.75rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.secondary {
            background-color: #475569;
        }

        button.secondary:hover {
            background-color: #334155;
        }

        .toast {
            font-size: 0.85rem;
            color: #4ade80;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Image Prompt Obfuscator</h1>

    <div class="field-group">
        <label for="inputPrompt">Original Prompt</label>
        <textarea id="inputPrompt" placeholder="Enter your image prompt here..."></textarea>
    </div>

    <div class="field-group">
        <label for="modeSelect">Obfuscation Mode</label>
        <select id="modeSelect">
            <option value="light">Light (Invisible zero-width characters)</option>
            <option value="medium" selected>Medium (Subtle leetspeak + zero-width characters)</option>
            <option value="heavy">Heavy (Scrambled inner letters + heavy leetspeak)</option>
        </select>
    </div>

    <div class="button-group">
        <button onclick="processPrompt()">Obfuscate Prompt</button>
        <button class="secondary" onclick="copyOutput()">Copy Result</button>
    </div>

    <div class="field-group">
        <label for="outputPrompt">Obfuscated Output</label>
        <textarea id="outputPrompt" readonly placeholder="Result will appear here..."></textarea>
        <div id="toast" class="toast">Copied to clipboard!</div>
    </div>
</div>

<script>
    const LEET_MAP = {
        'a': ['4', '@'],
        'e': ['3'],
        'i': ['1', '!'],
        'o': ['0'],
        's': ['$', '5'],
        't': ['7']
    };

    const UNICODE_INSERTS = ['\u200b', '\u200c', '\u200d', '\u00ad'];

    function leetTransform(word, probability = 0.5) {
        return word.split('').map(char => {
            const lowerChar = char.toLowerCase();
            if (LEET_MAP[lowerChar] && Math.random() < probability) {
                const choices = LEET_MAP[lowerChar];
                const replacement = choices[Math.floor(Math.random() * choices.length)];
                return char === char.toUpperCase() ? replacement.toUpperCase() : replacement;
            }
            return char;
        }).join('');
    }

    function injectZeroWidth(word, probability = 0.3) {
        if (word.length <= 2) return word;
        let newWord = [];
        const chars = word.split('');
        for (let i = 0; i < chars.length - 1; i++) {
            newWord.push(chars[i]);
            if (Math.random() < probability) {
                const randomInsert = UNICODE_INSERTS[Math.floor(Math.random() * UNICODE_INSERTS.length)];
                newWord.push(randomInsert);
            }
        }
        newWord.push(chars[chars.length - 1]);
        return newWord.join('');
    }

    function scrambleInnerLetters(word) {
        if (word.length <= 3) return word;
        const mid = word.slice(1, -1).split('');
        // Fisher-Yates shuffle algorithm
        for (let i = mid.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [mid[i], mid[j]] = [mid[j], mid[i]];
        }
        return word[0] + mid.join('') + word[word.length - 1];
    }

    function obfuscateText(prompt, mode) {
        const words = prompt.split(' ');
        const obfuscatedWords = words.map(word => {
            // Regex to isolate word boundary punctuation
            const match = word.match(/^(\W*)([\w-]+)(\W*)$/);
            if (!match) return word;

            let [_, prefix, core, suffix] = match;

            if (mode === 'light') {
                core = injectZeroWidth(core, 0.4);
            } else if (mode === 'medium') {
                core = leetTransform(core, 0.3);
                core = injectZeroWidth(core, 0.3);
            } else if (mode === 'heavy') {
                core = scrambleInnerLetters(core);
                core = leetTransform(core, 0.6);
                core = injectZeroWidth(core, 0.5);
            }

            return `${prefix}${core}${suffix}`;
        });

        return obfuscatedWords.join(' ');
    }

    function processPrompt() {
        const input = document.getElementById('inputPrompt').value;
        const mode = document.getElementById('modeSelect').value;
        const output = obfuscateText(input, mode);
        document.getElementById('outputPrompt').value = output;
    }

    function copyOutput() {
        const outputArea = document.getElementById('outputPrompt');
        if (!outputArea.value) return;

        outputArea.select();
        navigator.clipboard.writeText(outputArea.value).then(() => {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        });
    }
</script>

</body>
</html>
